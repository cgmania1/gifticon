<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- [디자인 개선] 브라우저/공유 화면에 서비스의 이름과 대표 색상을 일관되게 노출합니다. -->
  <title>우리 가족 기프티콘 · Family Gift</title>
  <meta name="description" content="가족이 함께 기프티콘을 등록하고, 유효기간 D-day·사용 여부·예약자·금액형 잔액을 한눈에 관리하는 가족용 보관함입니다.">
  <meta name="theme-color" content="#2F2A5A">
  <meta name="application-name" content="Family Gift">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/family-gift-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="inner header-inner">
      <!-- [디자인 개선] 따뜻한 선물 상자 심볼을 붙여 서비스의 핵심 가치(가족+선물)를 한눈에 전달합니다. -->
      <a class="brand" href="#/" aria-label="우리 가족 기프티콘 보관함 홈">
        <img class="brand-mark" src="assets/family-gift-logo.svg" alt="" width="42" height="42">
        <span class="brand-copy">
          <span class="brand-name">우리 가족 기프티콘</span>
          <span class="brand-sub" id="who">불러오는 중</span>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="주 메뉴">
        <a href="#/" data-route="/"><span class="nav-icon" aria-hidden="true">⌂</span>보관함</a>
        <a href="#/add" data-route="/add"><span class="nav-icon" aria-hidden="true">＋</span>등록</a>
        <a href="#/log" data-route="/log"><span class="nav-icon" aria-hidden="true">◷</span>기록</a>
        <a href="#/family" data-route="/family"><span class="nav-icon" aria-hidden="true">♥</span>가족</a>
        <a href="#/settings" data-route="/settings"><span class="nav-icon" aria-hidden="true">⚙</span>설정</a>
      </nav>
    </div>
  </header>

  <div id="demoBanner" class="demo-banner" hidden><strong>체험 모드</strong> — 예시 가족·기프티콘이며 이 브라우저에만 저장됩니다. 가족과 함께 쓰려면 「설정」에서 본인 Supabase 를 연결해 주세요.</div>
  <div id="connError" class="store-banner" hidden></div>
  <div id="storeBanner" class="store-banner" hidden>이 브라우저에서는 저장소를 쓸 수 없어, 창을 닫으면 체험 데이터와 설정이 사라집니다.</div>

  <main id="main" class="inner main" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="inner footer-inner"><span>Family Gift</span> · 사용 여부는 사용자가 직접 표시합니다 · 알림은 앱에서 가족 모두에게 보입니다 · 「가족에게 보내기」로 휴대폰 카카오톡·문자에 무료로 보낼 수 있습니다.</div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="dialog" class="dialog">
    <form method="dialog" class="dialog-body" id="dialogForm">
      <h2 id="dialogTitle"></h2>
      <div id="dialogContent"></div>
      <div class="dialog-actions" id="dialogActions"></div>
    </form>
  </dialog>

  <!-- 기존 동작 순서는 유지합니다. 외부 CDN 없이 GitHub Pages에서도 그대로 동작하도록 vendor 폴더를 사용합니다. -->
  <script src="vendor/supabase.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
